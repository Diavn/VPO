<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/accounts.css"><script defer src="/accounts.js"></script><title>VPO — Đăng ký</title></head><body data-page="register"><header>VPO / REGISTRATION <small>SYNTHETIC ONLY</small></header><main><h1>Đăng ký tài khoản VPO</h1><p>Chỉ email @example.test. Mã gửi tới hộp thư mô phỏng, không gửi email internet. Không nhập dữ liệu thật.</p><section><h2>1. Yêu cầu mã</h2><label for="email">Email</label><input id="email" type="email" autocomplete="email"><button id="request">Gửi mã</button><h2>2. Xác thực</h2><label for="challenge">Mã yêu cầu (UUID)</label><input id="challenge" autocomplete="off"><label for="code">Mã xác thực 8 chữ số</label><input id="code" inputmode="numeric" maxlength="8" autocomplete="one-time-code"><label for="newpass">Mật khẩu mới (tối thiểu 15 ký tự ASCII hoặc 15 byte UTF-8)</label><input id="newpass" type="password" autocomplete="new-password"><button id="verify">Xác thực và tạo tài khoản</button><p id="status" role="status"></p></section><p><a href="/admin">Quản trị</a></p></main></body></html>
