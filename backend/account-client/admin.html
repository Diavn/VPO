<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/accounts.css"><script defer src="/accounts.js"></script><title>VPO Admin — User Management</title></head><body data-page="admin"><header>VPO / ADMINISTRATION <small>SYNTHETIC ONLY</small></header><main><h1>Quản lý tài khoản</h1><section id="login"><label for="username">Tên đăng nhập</label><input id="username" value="admin" autocomplete="username"><label for="password">Mật khẩu</label><input type="password" id="password" autocomplete="current-password"><button id="signin">Đăng nhập</button></section><p id="status" role="status"></p><section id="workspace" hidden><button id="logout">Đăng xuất</button><h2>Thêm user qua lời mời</h2><label for="invite">Email mẫu</label><input id="invite" type="email" placeholder="student@example.test"><button id="add">Gửi mã xác thực mẫu</button><p id="invited"></p><h2>Danh sách user</h2><label for="search">Tìm theo email</label><input id="search"><button id="find">Tìm / Làm mới</button><p>Tối đa 200 kết quả mới nhất. Xóa tài khoản sẽ chặn truy cập, giữ minh chứng khảo thí.</p><div id="users"></div></section><p><a href="/register">Trang đăng ký user</a></p></main></body></html>
