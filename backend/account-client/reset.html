<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/accounts.css"><script defer src="/accounts.js"></script><title>VPO — Khôi phục mật khẩu mẫu</title></head><body data-page="reset"><header>VPO / ACCOUNT RECOVERY <small>SYNTHETIC ONLY</small></header><main><h1>Khôi phục mật khẩu</h1><p>Chỉ dùng tài khoản @example.test đã xác thực email. Mã được gửi vào hộp thư mô phỏng của phiên thử nghiệm, không gửi qua Internet. Không nhập dữ liệu thật.</p><section><h2>1. Yêu cầu mã</h2><label for="email">Email mẫu</label><input id="email" type="email" autocomplete="email"><button id="request">Gửi mã khôi phục</button><h2>2. Xác thực</h2><label for="challenge">Mã yêu cầu (UUID)</label><input id="challenge" autocomplete="off"><label for="code">Mã khôi phục 8 chữ số</label><input id="code" inputmode="numeric" maxlength="8" autocomplete="one-time-code"><label for="newpass">Mật khẩu mới (tối thiểu 15 byte UTF-8)</label><input id="newpass" type="password" autocomplete="new-password"><button id="verify">Xác thực và đổi mật khẩu</button><p id="status" role="status"></p></section><p><a href="/staging">Quay lại đăng nhập</a></p></main></body></html>
