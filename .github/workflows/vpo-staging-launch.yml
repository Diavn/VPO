name: VPO V6.6.2 demo certificate master regression
on:
  push:
    branches: [v6.6.2-demo-certificates]
  pull_request:
    branches: [v6.6.1-operational-finance]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpo-demo-certificates
  cancel-in-progress: true
jobs:
  fresh-launch:
    if: github.ref == 'refs/heads/v6.6.2-demo-certificates' || (github.event_name == 'pull_request' && github.head_ref == 'v6.6.2-demo-certificates' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify shell and JS syntax
        run: |
          bash -n backend/staging/launch.sh
          bash -n backend/ci/backup-restore-pilot.sh
          find backend -type f \( -name '*.cjs' -o -name '*.js' \) -print0 | xargs -0 -r -n1 node --check
          docker version
          psql --version
      - name: Verify release gate remains closed
        run: |
          node backend/release/check.cjs --check
          set +e
          node backend/release/check.cjs --production
          status=$?
          set -e
          test "$status" = 1
      - name: Install browser test dependencies
        working-directory: backend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: All unit and public portal tests
        run: |
          (cd backend && npm test)
          node tests/portal-demo.test.cjs
      - name: Render synthetic PDF and decode printed QR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          node backend/tests/rendered-certificate.cjs
      - name: Record public npm lockfile candidate
        working-directory: backend
        run: |
          node - <<'NODE'
          const fs=require("node:fs"),crypto=require("node:crypto"),assert=require("node:assert/strict");
          const file=fs.readFileSync("package-lock.json","utf8"),lock=JSON.parse(file);
          assert.equal(lock.lockfileVersion,3);
          for(const [name,p] of Object.entries(lock.packages)){
            if(!name)continue;
            assert(typeof p.resolved==="string"&&p.resolved.startsWith("https://registry.npmjs.org/"));
            assert(typeof p.integrity==="string"&&/^sha(512|1)-[A-Za-z0-9+/=]+$/.test(p.integrity));
          }
          console.log("VPO_LOCKFILE_SHA256 "+crypto.createHash("sha256").update(file).digest("hex"));
          for(let i=0;i<file.length;i+=1500)console.log("VPO_LOCKFILE_PART "+(i/1500)+" "+JSON.stringify(file.slice(i,i+1500)));
          console.log("VPO_LOCKFILE_END "+Math.ceil(file.length/1500));
          NODE
      - name: Launch full master regression
        run: bash backend/staging/launch.sh --check
      - name: Dependency vulnerability check (runtime)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Verify disposable container removed
        if: always()
        run: |
          test -z "$(docker ps -aq --filter label=vpo.synthetic=staging)"
