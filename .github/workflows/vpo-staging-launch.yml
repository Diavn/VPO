name: VPO V6.4 account security master regression
on:
  push:
    branches: [v6.4-account-security]
  pull_request:
    branches: [v6.3-admin-center]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpo-account-security
  cancel-in-progress: true
jobs:
  fresh-launch:
    if: github.ref == 'refs/heads/v6.4-account-security' || (github.event_name == 'pull_request' && github.head_ref == 'v6.4-account-security' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify shell and JS syntax
        run: |
          bash -n backend/staging/launch.sh
          bash -n backend/ci/backup-restore-pilot.sh
          find backend -type f \( -name '*.cjs' -o -name '*.js' \) -print0 | xargs -0 -r -n1 node --check
          docker version
          psql --version
      - name: Verify release gate remains closed
        run: |
          node backend/release/check.cjs --check
          set +e
          node backend/release/check.cjs --production
          status=$?
          set -e
          test "$status" = 1
      - name: Install browser test dependencies
        working-directory: backend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: All unit and public portal tests
        run: |
          (cd backend && npm test)
          node tests/portal-demo.test.cjs
      - name: Launch full master regression
        run: bash backend/staging/launch.sh --check
      - name: Dependency vulnerability check (runtime)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Verify disposable container removed
        if: always()
        run: |
          test -z "$(docker ps -aq --filter label=vpo.synthetic=staging)"
