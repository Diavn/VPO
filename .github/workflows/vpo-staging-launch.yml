name: VPO private staging launch gate
on:
  push:
    branches: [v5.7-private-staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpo-private-staging-launch
  cancel-in-progress: true
jobs:
  fresh-launch:
    if: github.ref == 'refs/heads/v5.7-private-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify shell and JS syntax
        run: |
          bash -n backend/staging/launch.sh
          find backend -type f \( -name '*.cjs' -o -name '*.js' \) -print0 | xargs -0 -r -n1 node --check
          docker version
          psql --version
      - name: Install browser test dependencies
        working-directory: backend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Launch fresh disposable stack and check
        run: bash backend/staging/launch.sh --check
      - name: Verify disposable container removed
        if: always()
        run: |
          test -z "$(docker ps -aq --filter label=vpo.synthetic=staging)"
